[package]
name = "opdm-core"
version.workspace = true
edition.workspace = true

[lib]
name = "opdm_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
sha1 = "0.10"
base64 = "0.22"
ureq = { version = "2.10", features = ["tls", "gzip"] }
dirs = "6"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
