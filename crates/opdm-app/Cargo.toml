[package]
name = "opdm-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "OpenDM"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "tray-icon" + "image-ico" → close-to-tray (icons/icon.ico is the tray icon)
# NOTE: no "devtools" feature on purpose — production builds must have no debug
# surface (F12/inspect). Debug builds get devtools automatically.
tauri = { version = "2", features = ["tray-icon", "image-ico"] }
# single-instance: launching OpenDM.exe again focuses the running app
tauri-plugin-single-instance = "2"
serde_json = "1"
url = "2"
opdm-core = { path = "../opdm-core" }
