[package]
name = "opdm-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "OpenDM"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "devtools" → F12 opens the WebView2 console in the shipped app (debug aid)
tauri = { version = "2", features = ["devtools"] }
serde_json = "1"
url = "2"
opdm-core = { path = "../opdm-core" }
